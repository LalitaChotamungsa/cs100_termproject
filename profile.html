<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolios Power Up!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
    <link rel="stylesheet" href="./css/festival.css">
    <link rel="icon" type="image/png" href="./Media/bee.png" />
    <script src="./js/festival.js" defer></script>
</head>
<body class="profile-page">
    <nav class="navbar-inner">
        <div class="logo-text">WEB-PORTFOLIO</div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-item">HOME</a></li>
            <li><a href="profile.html" class="nav-item">PROFILE</a></li>
            <li><a href="quiz.html" class="nav-item">QUIZ</a></li>
            <li>
                <a href="form.html" class="nav-item" aria-label="About">
                    <i class="fa-solid fa-user"></i>
                </a>
            </li>
        </ul>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <h1 class="h2 fw-bold mb-1">Learning Portfolios</h1>
                <p class="text-secondary mb-0">Explore profiles and their learning experiences.</p>
            </div>
            <div class="d-flex flex-wrap gap-2 portfolio-heading">
                <input type="file" id="importJsonInput" accept=".json,application/json" hidden>
                <button type="button" id="importJsonBtn" class="btn btn-primary">
                    <i class="fa-solid fa-file-import me-1"></i> Import JSON
                </button>
                <a href="./form.html" class="btn btn-success">+ Add New</a>
            </div>
        </div>

        <div id="portfolio-list" class="portfolio-list">
            <p class="text-secondary">Loading portfolios...</p>
        </div>

        <!-- ปุ่มเปลี่ยนหน้า (◀ 1 2 3 … ▶) -->
        <div id="pagination" class="pagination-bar" role="navigation" aria-label="Portfolio pages"></div>
    </main>

    <footer class="py-4 text-center text-secondary small">
        CS100 | POWER UP! Personal Learning Portfolio
    </footer>
