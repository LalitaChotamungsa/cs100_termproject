<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/style.css">
    <title>Dynamic Portfolio</title>
</head>
<body>
    <nav class="navbar-inner">
        <div class="logo-text">WEB-PORTFOLIO</div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-item">HOME</a></li>
            <li><a href="profile.html" class="nav-item">PROFILE</a></li>
            <li><a href="quiz.html" class="nav-item">QUIZ</a></li>
            <li>
                <a href="form.html" class="nav-item" aria-label="About">
                    <i class="fa-solid fa-user"></i>
                </a>
            </li>
        </ul>
    </nav>
     <main class="container">
        <!-- หน้าแรก -->
        <section id="home" class="page active">
          <div class="home-content">
            <p class="tag">PERSONALITY QUIZ</p>
            <h1>WHAT TYPE<br>ARE YOU?</h1>
            <p class="subtitle">คุณเป็นคนไทป์ไหนในแก๊ง?</p>
            <p class="description">ตอบคำถาม 8 ข้อ แล้วมาค้นหาไทป์ที่ใช่ของคุณกัน!</p>
            <button id="startBtn" class="quiz-start-btn">LET'S GO →</button>
          </div>
        </section>
        <!-- คำถาม -->
        <section id="quiz" class="page">
    <p id="questionNumber" class="question-number">QUESTION 1 / 8</p>
    <div class="quiz-header">
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>
    <div class="question-content">
        <h2 id="questionText"></h2>
        <div id="options" class="options"></div>
    </div>
    <div class="quiz-buttons">
        <button id="backBtn" class="back-btn">ย้อนกลับ</button>
        <button id="nextBtn" class="main-btn" disabled>ถัดไป →</button>
    </div>
</section>
    
        <section id="loading" class="page">
        <div class="loading-content">
            <div class="loader"></div>
            <h2>กำลังวิเคราะห์ไทป์ของคุณ...</h2>
            <p>กำลังค้นหาตัวตนที่แท้จริง 👀</p>
        </div>
        </section>
    
        <!-- ผลลัพธ์ -->
        <section id="result" class="page">
          <div class="result-card" id="resultCard">
            <p class="tag">YOUR PERSONALITY TYPE IS</p>
    
            <div id="resultEmoji" class="result-emoji"></div>
            <h1 id="resultTitle"></h1>
            <p id="resultEnglish" class="result-english"></p>
            <div class="result-line"></div>
            <h3 id="resultHeadline"></h3>
            <p id="resultDescription"></p>
            <br>
            <div class="result-footer">WHAT TYPE ARE YOU? • PERSONALITY QUIZ</div>
          </div>
          <br>
            <div class="result-buttons">
                <button id="exportBtn" class="main-btn">
                    Export Portfolio Item JSON ↓
                </button>
                <button id="downloadBtn" class="secondary-btn">
                    ดาวน์โหลดรูป ↓
                </button>
                <button id="restartBtn" class="back-btn">
                    ทำแบบทดสอบอีกครั้ง
                </button>
                <br>
            </div>
        </section>
      </main>
       <script src="./js/app.js" defer></script>
</body>    
</html>
